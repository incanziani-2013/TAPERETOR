name: Build plugin

# Every push builds the installers and uploads them as workflow artifacts.
# Pushing a tag like v1.0.0 also publishes them in a GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          project="$(sed -nE 's/^project\(TRAPERETOR VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$project" ]]; then
              echo "::warning::Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($project)"
            fi
          else
            version="$project-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Get VST2 SDK (optional)
        env:
          VST2_SDK_URL: ${{ secrets.VST2_SDK_URL }}
          VST2_SDK_ZIP_BASE64: ${{ secrets.VST2_SDK_ZIP_BASE64 }}
        run: ./.github/scripts/get-vst2-sdk.ps1
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Build installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$PWD\build\TRAPERETOR_artefacts\Release" "/DOutputDir=$PWD\dist" installer\windows\TRAPERETOR.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Zip plugins
        run: |
          $release = 'build\TRAPERETOR_artefacts\Release'
          $paths = @("$release\VST3") + @("$release\VST" | Where-Object { Test-Path $_ })
          Compress-Archive -Path $paths -DestinationPath "dist\TRAPERETOR-$env:VERSION-Windows-Plugins.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TRAPERETOR-Windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get VST2 SDK (optional)
        shell: pwsh
        env:
          VST2_SDK_URL: ${{ secrets.VST2_SDK_URL }}
          VST2_SDK_ZIP_BASE64: ${{ secrets.VST2_SDK_ZIP_BASE64 }}
        run: ./.github/scripts/get-vst2-sdk.ps1
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign plugins (ad-hoc)
        working-directory: build/TRAPERETOR_artefacts/Release
        run: |
          codesign --force --deep -s - VST3/TRAPERETOR.vst3
          if [ -d VST/TRAPERETOR.vst ]; then codesign --force --deep -s - VST/TRAPERETOR.vst; fi
      - name: Build installer
        run: bash installer/macos/build_pkg.sh build/TRAPERETOR_artefacts/Release "$VERSION" dist
      - name: Zip plugins
        working-directory: build/TRAPERETOR_artefacts/Release
        run: zip -r -y "$GITHUB_WORKSPACE/dist/TRAPERETOR-$VERSION-macOS-Plugins.zip" VST3 $( [ -d VST ] && echo VST )
      - uses: actions/upload-artifact@v4
        with:
          name: TRAPERETOR-macOS
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
